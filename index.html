<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b2a4a; touch-action:none; -webkit-user-select:none; user-select:none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center; background:rgba(5,20,40,.72); gap:14px; padding:24px; box-sizing:border-box; }
  .overlay.hidden { display:none; }
  .overlay h1 { margin:0; font-size:44px; letter-spacing:1px; color:#ff6a2b; text-shadow:0 3px 0 #7a2a0a; }
  .overlay p { margin:0; font-size:16px; opacity:.9; max-width:320px; line-height:1.4; }
  .overlay img { width:120px; height:120px; }
  .btn { margin-top:8px; font-size:20px; font-weight:700; color:#fff; background:#ff5a1f; border:none; border-radius:16px; padding:14px 34px; box-shadow:0 5px 0 #a8360d; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #a8360d; }
  .small { font-size:13px; opacity:.7; }
  #levelUp { position:fixed; left:50%; top:30%; transform:translate(-50%,-50%) scale(0); pointer-events:none; text-align:center; color:#fff; font-weight:800; font-size:28px; text-shadow:0 3px 6px rgba(0,0,0,.5); transition:transform .25s cubic-bezier(.2,1.6,.4,1), opacity .4s; opacity:0; }
  #levelUp img { width:110px; height:110px; display:block; margin:0 auto 6px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
  #controls { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end; padding:0 16px calc(18px + env(safe-area-inset-bottom)) 16px; pointer-events:none; z-index:5; }
  #controls.hidden { display:none; }
  .arrows { display:flex; gap:14px; }
  .cbtn { pointer-events:auto; touch-action:none; -webkit-tap-highlight-color:transparent; border:none; color:#fff; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.35); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); transition:transform .06s, background .06s; }
  .cbtn svg { width:34px; height:34px; fill:#fff; pointer-events:none; }
  .arrow { width:72px; height:72px; border-radius:20px; }
  .jump { width:92px; height:92px; border-radius:50%; background:rgba(255,90,31,.75); border-color:rgba(255,200,170,.7); font-weight:800; font-size:16px; letter-spacing:.5px; }
  .cbtn.on { transform:scale(.92); background:rgba(255,255,255,.35); }
  .jump.on { background:rgba(255,120,60,.95); }
  .overlay { z-index:10; }
  .mp { width:100%; max-width:330px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .nick { width:100%; box-sizing:border-box; font-size:17px; padding:11px 14px; border-radius:12px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; text-align:center; outline:none; }
  .nick:focus { border-color:#ff6a2b; }
  .nick::placeholder { color:rgba(255,255,255,.5); }
  .btn2 { font-size:15px; font-weight:700; color:#fff; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.3); border-radius:12px; padding:10px 18px; cursor:pointer; }
  .btn2:active { transform:translateY(2px); }
  .mpstatus { font-size:13px; opacity:.85; }
  .plist { list-style:none; margin:0; padding:0; width:100%; font-size:15px; }
  .plist li { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.07); margin-top:4px; text-align:left; }
  .plist .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .plist .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plist .sc { font-weight:700; font-variant-numeric:tabular-nums; }
  .linkbox { width:100%; box-sizing:border-box; font-size:13px; padding:8px; border-radius:8px; border:none; background:rgba(255,255,255,.9); color:#111; }
  .hiddenEl { display:none !important; }
  .overlay { overflow-y:auto; justify-content:flex-start; padding-top:max(40px, env(safe-area-inset-top)); }
  .overlay > :first-child { margin-top:auto; }

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

function showBest() { document.getElementById('bestStart').textContent = best ? `Record: ${best}` : ''; }
showBest();

// ---------- input ----------
let tiltX = 0, touchDir = 0, keyDir = 0, useTilt = false, jumpBuffer = 0;
// On-screen controls: ◀ ▶ to move, SALTA to jump. Multi-touch, so you can hold an arrow and jump.
let leftHeld = false, rightHeld = false;
function updateTouchDir() { touchDir = (rightHeld ? 1 : 0) - (leftHeld ? 1 : 0); }
function holdButton(id, onDown, onUp) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {} el.classList.add('on'); onDown(); };
  const up = e => { e.preventDefault(); el.classList.remove('on'); onUp(); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdButton('btnLeft', () => { leftHeld = true; updateTouchDir(); }, () => { leftHeld = false; updateTouchDir(); });
holdButton('btnRight', () => { rightHeld = true; updateTouchDir(); }, () => { rightHeld = false; updateTouchDir(); });
holdButton('btnJump', () => { jumpBuffer = 8; }, () => {});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keyDir = -1;
  if (e.key === 'ArrowRight' || e.key === 'd') keyDir = 1;
  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !e.repeat) { jumpBuffer = 8; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if ((e.key === 'ArrowLeft' || e.key === 'a') && keyDir === -1) keyDir = 0;
  if ((e.key === 'ArrowRight' || e.key === 'd') && keyDir === 1) keyDir = 0;
});
// stop page scrolling / zoom gestures on the game area
cv.addEventListener('touchstart', e => e.preventDefault(), { passive:false });
cv.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
function onTilt(e) {
  if (e.gamma == null) return;
  useTilt = true;
  tiltX = Math.max(-1, Math.min(1, e.gamma / 25));
}
async function enableTilt() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r === 'granted') window.addEventListener('deviceorientation', onTilt);
    } else {
      window.addEventListener('deviceorientation', onTilt);
    }
  } catch (e) {}
}

// ---------- game state ----------
const GRAV = 0.32, JUMP = -11.2, SPRING = -18, MAXVX = 4.8;
const LEVEL_HEIGHT = 1500; // pixels climbed per level
let squid, plats, camY, maxClimb, level, state = 'start', particles, bubbles;

function rand(a, b) { return a + Math.random() * (b - a); }

// Seeded random numbers for everything that shapes the map: same seed → same map for every player.
let seedState = 1;
function setSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  seedState = h >>> 0 || 1;
}
function srand() { // mulberry32
  seedState = (seedState + 0x6D2B79F5) >>> 0;
  let t = seedState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rnd(a, b) { return a + srand() * (b - a); }
// Difficulty depends on the altitude of the platform being built, not on the player's progress,
// so two players generate identical maps whatever their pace.
function levelAt(worldY) { return Math.max(1, Math.floor(altAt(worldY) / (LEVEL_HEIGHT / 10)) + 1); }
function diffAt(worldY) { return Math.min(1, (levelAt(worldY) - 1) / 10); }

function difficulty() {
  // 0 → 1 over ~10 levels, keeps growing slowly after
  return Math.min(1, (level - 1) / 10);
}

// ---------- the journey: abyss → ocean → surface → sky → space ----------
// Altitudes are in score units (same as the score counter).
const SURFACE = 900;
const ZONES = [
  { at: 0,    name: '🦑 Abissi' },
  { at: 250,  name: '🐟 Oceano profondo' },
  { at: 550,  name: '🐠 Mare aperto' },
  { at: SURFACE, name: '🌊 Superficie!' },
  { at: 1000, name: '☁️ Cielo' },
  { at: 1500, name: '✈️ Alta quota' },
  { at: 2100, name: '🚀 Spazio!' },
];
const WATER_COLORS = [[0, 2, 4, 12], [250, 6, 22, 48], [550, 10, 58, 105], [880, 40, 150, 200], [SURFACE, 70, 180, 225]];
const SKY_COLORS = [[SURFACE, 150, 215, 250], [1200, 95, 170, 235], [1600, 50, 100, 190], [1950, 20, 30, 80], [2250, 4, 5, 16]];
function altAt(worldY) { return (H - 214 - worldY) / 10; }
function worldYAt(alt) { return H - 214 - alt * 10; }
function lerpColor(frames, alt) {
  if (alt <= frames[0][0]) return frames[0].slice(1);
  for (let i = 1; i < frames.length; i++) {
    if (alt <= frames[i][0]) {
      const a = frames[i - 1], b = frames[i], t = (alt - a[0]) / (b[0] - a[0]);
      return [0, 1, 2].map(k => a[k + 1] + (b[k + 1] - a[k + 1]) * t);
    }
  }
  return frames[frames.length - 1].slice(1);
}
function colorAt(alt) {
  const c = alt < SURFACE ? lerpColor(WATER_COLORS, alt) : lerpColor(SKY_COLORS, alt);
  return `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
}
function zoneIndex(alt) { let z = 0; for (let i = 0; i < ZONES.length; i++) if (alt >= ZONES[i].at) z = i; return z; }
let zoneShown = 0, zoneTimer = null;
function showZone(i) {
  const el = document.getElementById('zone');
  el.textContent = ZONES[i].name;
  el.classList.add('show');
  clearTimeout(zoneTimer);
  zoneTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// Scenery that lives in the world and scrolls with it
let decor = [];
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, tw: Math.random() * 6.28 }));
function addDecor(worldY) {
  const alt = altAt(worldY);
  if (srand() > 0.45) return;
  const r = srand();
  let kind;
  if (alt < 250) kind = r < 0.5 ? 'angler' : 'glow';
  else if (alt < SURFACE - 40) kind = r < 0.55 ? 'fish' : 'jelly';
  else if (alt < SURFACE + 60) return;
  else if (alt < 1500) kind = r < 0.7 ? 'cloud' : 'bird';
  else if (alt < 2050) kind = r < 0.6 ? 'cloud' : 'plane';
  else kind = r < 0.25 ? 'planet' : (r < 0.6 ? 'satellite' : 'comet');
  decor.push({ kind, x: rnd(0, W), y: worldY + rnd(-40, 40), s: rnd(0.6, 1.3), vx: rnd(0.2, 0.8) * (srand() < .5 ? -1 : 1), hue: rnd(0, 360), seed: rnd(0, 6.28) });
}

function platWidth(y) {
  const d = diffAt(y), lv = levelAt(y);
  return Math.max(52, 84 - d * 28 - Math.max(0, lv - 11) * 1.2);
}

// Horizontal reach (px) for a jump that has to climb dy px, starting from standstill.
// Simulates the real physics, so the guaranteed path always matches what the squid can do.
const reachCache = {};
function reach(dy) {
  const k = Math.round(dy);
  if (reachCache[k] != null) return reachCache[k];
  let y = 0, vy = JUMP, x = 0, vx = 0, best = 0;
  for (let f = 0; f < 400; f++) {
    vx += (MAXVX - vx) * 0.16; x += vx;
    vy = Math.min(vy + GRAV, 13); y += vy;
    if (vy > 0 && -y <= dy) { best = x; break; }
  }
  return (reachCache[k] = best);
}

function basePlat(cx, y, w) {
  const x = Math.max(8, Math.min(W - w - 8, cx - w / 2));
  const d = diffAt(y), lv = levelAt(y);
  // frames a bubble lasts once touched: ~1.8s at level 1 → ~0.9s at level 11
  const popTime = Math.round(Math.max(40, 110 - d * 55 - Math.max(0, lv - 11) * 1.5));
  return { x, y, w, h: 14, type: 'normal', broken: false, spring: false, alpha: 1, timer: -1, popTime,
           baseX: x, amp: 0, phase: 0, speed: 0, seed: srand() * 6.28 };
}

// Next platform on the guaranteed path: never breaks, always within jump reach of the previous one.
let pathCx, pathY, pathAmp = 0;
function nextPathPlat() {
  const d = diffAt(pathY), lv = levelAt(pathY);
  const dy = gap();
  const w = platWidth(pathY);
  // drifting bubbles sway around a centre; their worst-case offset is taken out of the reach budget
  const amp = (lv >= 2 && srand() < 0.10 + d * 0.25) ? rnd(20, 30 + d * 20) : 0;
  // safety margin: 65% of real reach, plus landing tolerance, minus how far both bubbles can drift
  const maxDx = Math.max(10, Math.min(W / 2, reach(dy) * 0.65 + w / 2 - amp - pathAmp));
  const cx = pathCx + rnd(-maxDx, maxDx);
  const p = basePlat(cx, pathY - dy, w);
  if (amp) {
    p.type = 'move'; p.amp = amp;
    p.baseX = Math.max(8 + amp, Math.min(W - w - 8 - amp, p.x));
    p.x = p.baseX; p.phase = rnd(0, 6.28); p.speed = rnd(0.02, 0.03 + d * 0.025);
  }
  if (srand() < 0.06) p.spring = true;
  p.path = true;
  pathCx = p.baseX + p.w / 2; pathY = p.y; pathAmp = amp;
  return p;
}

// Optional extra platforms: crumbling decoys and bonus steps. Never needed to progress.
function extraPlat(yTop, yBot) {
  const d = diffAt(yTop), lv = levelAt(yTop);
  if (yBot - yTop < 56) return null; // keeps clear of both path bubbles (decided by height only)
  const w = platWidth(yTop);
  const y = rnd(yTop + 26, yBot - 26);
  const p = basePlat(rnd(w / 2 + 8, W - w / 2 - 8), y, w);
  // thin, pinkish bubbles that pop almost instantly
  if (lv >= 3 && srand() < 0.35 + d * 0.45) { p.type = 'fragile'; p.popTime = 18; }
  return p;
}

function addPathSegment() {
  const prevY = pathY;
  addDecor(pathY);
  const p = nextPathPlat();
  plats.push(p);
  // fewer helpful extras as difficulty rises
  if (srand() < 0.55 - diffAt(pathY) * 0.25) {
    const e = extraPlat(p.y, prevY);
    if (e) plats.push(e); // never depends on screen width, so every player gets the same map
  }
}

function gap() {
  const d = diffAt(pathY);
  const minG = 45 + d * 35, maxG = 75 + d * 50;
  return Math.min(rnd(minG, maxG), 125);
}

function makeSeabed() {
  const f = { rocks: [], anemones: [], weeds: [], vent: rnd(0.12, 0.3) * (srand() < .5 ? 1 : -1) + 0.5 };
  for (let i = 0; i < 5; i++) f.rocks.push({ x: rnd(0, 1), r: rnd(14, 30), h: rnd(0.5, 0.9) });
  for (let i = 0; i < 4; i++) f.anemones.push({ x: rnd(0.05, 0.95), hue: [170, 200, 290, 320][i], seed: rnd(0, 6.28) });
  for (let i = 0; i < 4; i++) f.weeds.push({ x: rnd(0, 1), h: rnd(30, 60), seed: rnd(0, 6.28) });
  return f;
}

function drawSeabed(p) {
  const top = p.y - camY, f = p.seabed, t = Date.now() / 1000;
  if (top > H + 20) return;
  // back silhouettes of distant rocks
  ctx.fillStyle = '#0a0f1c';
  for (const r of f.rocks) { ctx.beginPath(); ctx.ellipse(r.x * W, top + 4, r.r * 1.6, r.r * r.h * 1.5, 0, Math.PI, 0); ctx.fill(); }
  // hydrothermal vent with rising bubbles and a warm glow
  const vx = f.vent * W;
  const vg = ctx.createRadialGradient(vx, top - 26, 2, vx, top - 26, 50);
  vg.addColorStop(0, 'rgba(255,120,60,0.35)'); vg.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = vg; ctx.fillRect(vx - 50, top - 76, 100, 100);
  ctx.fillStyle = '#1b1820';
  ctx.beginPath(); ctx.moveTo(vx - 16, top + 2); ctx.lineTo(vx - 6, top - 30); ctx.lineTo(vx + 6, top - 30); ctx.lineTo(vx + 16, top + 2); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 6; i++) {
    const ph = (t * 0.6 + i / 6) % 1;
    ctx.fillStyle = `rgba(200,230,255,${0.5 * (1 - ph)})`;
    ctx.beginPath(); ctx.arc(vx + Math.sin(t * 2 + i * 2) * 5, top - 32 - ph * 90, 2 + ph * 3, 0, Math.PI * 2); ctx.fill();
  }
  // swaying seaweed
  ctx.strokeStyle = '#1d3b33'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const w of f.weeds) {
    const x = w.x * W, sw = Math.sin(t * 1.2 + w.seed) * 8;
    ctx.beginPath(); ctx.moveTo(x, top + 2); ctx.quadraticCurveTo(x + sw, top - w.h / 2, x + sw * 1.4, top - w.h); ctx.stroke();
  }
  // seabed floor: dark sediment with a soft rim and specks
  const g = ctx.createLinearGradient(0, top, 0, top + 200);
  g.addColorStop(0, '#2a2433'); g.addColorStop(0.15, '#16131e'); g.addColorStop(1, '#07060b');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, H + 400);
  for (let x = 0; x <= W; x += 12) ctx.lineTo(x, top + Math.sin(x * 0.07) * 1.5);
  ctx.lineTo(W, H + 400); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(120,110,150,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); for (let x = 0; x <= W; x += 12) ctx.lineTo(x, top + Math.sin(x * 0.07) * 1.5); ctx.stroke();
  ctx.fillStyle = 'rgba(160,150,190,0.25)';
  for (let i = 0; i < 40; i++) { const x = (i * 97.3) % W, y = top + 8 + ((i * 53.7) % 120); ctx.fillRect(x, y, 2, 2); }
  // glowing anemones on the floor
  for (const a of f.anemones) {
    const x = a.x * W, glow = 0.55 + 0.35 * Math.sin(t * 2 + a.seed);
    const ag = ctx.createRadialGradient(x, top - 6, 1, x, top - 6, 22);
    ag.addColorStop(0, `hsla(${a.hue},100%,70%,${glow * 0.6})`); ag.addColorStop(1, `hsla(${a.hue},100%,70%,0)`);
    ctx.fillStyle = ag; ctx.fillRect(x - 22, top - 28, 44, 34);
    ctx.strokeStyle = `hsla(${a.hue},100%,72%,${glow})`; ctx.lineWidth = 2;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(x + i * 1.5, top + 1);
      ctx.quadraticCurveTo(x + i * 3 + Math.sin(t * 2 + a.seed + i) * 2, top - 7, x + i * 4, top - 12 + Math.abs(i));
      ctx.stroke();
    }
  }
}

function reset(seedStr) {
  setSeed(seedStr || String(Math.random()));
  level = 1; camY = 0; maxClimb = 0;
  squid = { x: W / 2 - 18, y: H - 170 - 44, w: 36, h: 44, vx: 0, vy: 0, face: 1, squash: 0, ground: null, coyote: 0 };
  jumpBuffer = 0;
  plats = [];
  decor = [];
  zoneShown = 0;
  particles = [];
  bubbles = [];
  for (let i = 0; i < 25; i++) bubbles.push({ x: rand(0, W), y: rand(0, H), r: rand(2, 6), s: rand(.2, .6) });
  // safe starting platform under squid
  // starting rock on the seabed: the only thing that never pops
  // abyssal seabed spanning the whole width: the only thing that never pops
  plats.push({ x: 0, y: H - 170, w: W, h: 14, type: 'rock', broken: false, spring: false, alpha: 1, timer: -1, baseX: 0, amp: 0, seabed: makeSeabed() });
  pathCx = W / 2; pathY = H - 170; pathAmp = 0;
  while (pathY > -H) addPathSegment();
}

function popBubble(p) {
  p.broken = true; p.alpha = 0;
  const cx = p.x + p.w / 2, cy = p.y + 4;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    particles.push({ x: cx + Math.cos(a) * p.w / 2, y: cy + Math.sin(a) * 10, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 1.4 - 1, life: 1, color: '#dff6ff' });
  }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: rand(-2, 2), vy: rand(-3, 0), life: 1, color });
}

let luTimer = null;
function levelUp() {
  level++;
  const el = document.getElementById('levelUp');
  document.getElementById('luText').textContent = `LIVELLO ${level}`;
  el.classList.add('show');
  clearTimeout(luTimer);
  luTimer = setTimeout(() => el.classList.remove('show'), 1300);
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
}

function update() {
  // horizontal input
  let dir = touchDir || keyDir;
  let target = dir ? dir * MAXVX : (useTilt ? tiltX * MAXVX : 0);
  squid.vx += (target - squid.vx) * 0.16;
  if (Math.abs(squid.vx) > 0.3) squid.face = Math.sign(squid.vx);
  squid.x += squid.vx;
  if (squid.x + squid.w < 0) squid.x = W;
  if (squid.x > W) squid.x = -squid.w;

  squid.squash *= 0.85;
  if (jumpBuffer > 0) jumpBuffer--;
  if (squid.coyote > 0) squid.coyote--;

  // the seabed spans the whole width (and the squid wraps around the edges), so you can never fall off it
  const overlaps = p => p.type === 'rock' || squid.x + squid.w * 0.8 > p.x && squid.x + squid.w * 0.2 < p.x + p.w;

  // standing on a platform
  if (squid.ground) {
    const g = squid.ground;
    if (g.type === 'move') squid.x += g.dx || 0;
    if (g.broken || !overlaps(g)) { squid.ground = null; squid.coyote = 6; }
    else { squid.y = g.y - squid.h; squid.vy = 0; }
  }

  // jump (you decide when)
  if (jumpBuffer > 0 && (squid.ground || squid.coyote > 0)) {
    squid.vy = JUMP;
    squid.ground = null; squid.coyote = 0; jumpBuffer = 0;
    squid.squash = 0.6;
    spawnParticles(squid.x + squid.w / 2, squid.y + squid.h, '#bfe8ff', 6);
  }

  // vertical
  if (!squid.ground) {
    squid.vy = Math.min(squid.vy + GRAV, 13);
    squid.y += squid.vy;
  }

  // landing only when falling
  if (!squid.ground && squid.vy > 0) {
    for (const p of plats) {
      if (p.broken) continue;
      const feet = squid.y + squid.h;
      if (feet >= p.y && feet - squid.vy <= p.y + 2 && overlaps(p)) {
        squid.y = p.y - squid.h;
        if (p.spring && squid.x + squid.w / 2 > p.x + p.w / 2 - 14 && squid.x + squid.w / 2 < p.x + p.w / 2 + 14) {
          squid.vy = SPRING;
          if (p.type !== 'rock' && p.timer < 0) p.timer = 12;
          spawnParticles(squid.x + squid.w / 2, p.y, '#ffd34d', 14);
        } else {
          squid.vy = 0;
          squid.ground = p;
          if (p.type !== 'rock' && p.timer < 0) p.timer = p.popTime; // starts wobbling, then pops
        }
        squid.squash = 1;
        break;
      }
    }
  }

  // camera follows upward
  const screenY = squid.y - camY;
  if (screenY < H * 0.42) camY = squid.y - H * 0.42;

  // score & level
  const climbed = Math.max(0, Math.round((H - 214 - squid.y) / 10));
  if (climbed > maxClimb) maxClimb = climbed;
  if (maxClimb >= level * (LEVEL_HEIGHT / 10)) levelUp();

  // platforms: move, cull, spawn
  for (const p of plats) {
    if (p.type === 'move') {
      p.phase += p.speed;
      const nx = p.baseX + Math.sin(p.phase) * p.amp;
      p.dx = nx - p.x; p.x = nx;
    }
    if (p.timer > 0 && --p.timer === 0) popBubble(p);
  }
  plats = plats.filter(p => p.y - camY < H + 40 && p.alpha > 0);
  for (const d of decor) { if (d.kind !== 'planet') { d.x += d.vx; if (d.x < -80) d.x = W + 80; if (d.x > W + 80) d.x = -80; } }
  decor = decor.filter(d => d.y - camY < H + 120);
  const zi = zoneIndex(maxClimb);
  if (zi > zoneShown) { zoneShown = zi; showZone(zi); }
  while (pathY > camY - H) addPathSegment();

  // particles
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.15; pt.life -= 0.03; }
  particles = particles.filter(pt => pt.life > 0);

  // bubbles (parallax)
  for (const b of bubbles) { b.y -= b.s; if (b.y < -10) { b.y = H + 10; b.x = rand(0, W); } }

  // death
  if (squid.y - camY > H + 20) gameOver();
}

// ---------- drawing ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const N = 10;
  for (let i = 0; i <= N; i++) g.addColorStop(i / N, colorAt(altAt(camY + (i / N) * H)));
  const sy = worldYAt(SURFACE) - camY; // surface line on screen
  if (sy > 0 && sy < H) {
    const f = sy / H;
    g.addColorStop(Math.max(0, f - 0.0005), colorAt(SURFACE + 0.01));
    g.addColorStop(Math.min(1, f + 0.0005), colorAt(SURFACE - 0.01));
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const topAlt = altAt(camY), midAlt = altAt(camY + H / 2);
  const t = Date.now() / 1000;

  // stars fade in high up
  const starA = Math.max(0, Math.min(1, (midAlt - 1650) / 450));
  if (starA > 0) {
    for (const st of stars) {
      const yy = ((st.y * H - camY * 0.04) % H + H) % H;
      ctx.globalAlpha = starA * (0.6 + 0.4 * Math.sin(t * 2 + st.tw));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(st.x * W, yy, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // sun in the sky, fades out toward space
  const sunA = Math.max(0, Math.min(1, (topAlt - SURFACE + 20) / 120)) * Math.max(0, Math.min(1, (2200 - midAlt) / 400));
  if (sunA > 0) {
    ctx.globalAlpha = sunA;
    const sg = ctx.createRadialGradient(W - 70, 90, 5, W - 70, 90, 90);
    sg.addColorStop(0, 'rgba(255,250,210,1)'); sg.addColorStop(0.3, 'rgba(255,230,140,0.8)'); sg.addColorStop(1, 'rgba(255,230,140,0)');
    ctx.fillStyle = sg; ctx.fillRect(W - 160, 0, 180, 190);
    ctx.globalAlpha = 1;
  }

  // light rays from the surface, only in the upper ocean
  if (sy > -200 && midAlt > 450 && midAlt < SURFACE + 200) {
    const rayA = Math.max(0, Math.min(0.12, (midAlt - 450) / 3000));
    ctx.fillStyle = `rgba(200,240,255,${rayA})`;
    for (let i = 0; i < 5; i++) {
      const x0 = (i * W / 4 + Math.sin(t * 0.3 + i) * 20);
      ctx.beginPath(); ctx.moveTo(x0, Math.max(0, sy)); ctx.lineTo(x0 + 40, Math.max(0, sy)); ctx.lineTo(x0 - 60, H); ctx.lineTo(x0 - 120, H); ctx.closePath(); ctx.fill();
    }
  }

  // rising bubbles / marine snow: underwater only
  for (const b of bubbles) {
    if (altAt(b.y + camY) >= SURFACE) continue;
    const deep = altAt(b.y + camY) < 250;
    ctx.fillStyle = deep ? 'rgba(160,220,255,0.10)' : 'rgba(255,255,255,0.13)';
    ctx.beginPath(); ctx.arc(b.x, b.y, deep ? b.r * 0.5 : b.r, 0, Math.PI * 2); ctx.fill();
  }

  // scenery
  for (const d of decor) drawDecor(d, t);

  // waves at the surface
  if (sy > -30 && sy < H + 30) {
    ctx.fillStyle = 'rgba(120,200,240,0.55)';
    ctx.beginPath(); ctx.moveTo(0, H + 40);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, sy + Math.sin(x / 28 + t * 2) * 5);
    ctx.lineTo(W, H + 40); ctx.closePath(); ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, sy + Math.sin(x / 28 + t * 2) * 5);
    ctx.stroke();
  }
}

function drawDecor(d, t) {
  const x = d.x, y = d.y - camY, s = d.s;
  if (y < -120 || y > H + 120) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (d.vx < 0 ? -1 : 1), s);
  switch (d.kind) {
    case 'angler': {
      ctx.fillStyle = '#0d1424';
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-34, -10); ctx.lineTo(-34, 10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#1c2840'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(8, -12); ctx.quadraticCurveTo(22, -30, 30, -16); ctx.stroke();
      const glow = 0.6 + 0.4 * Math.sin(t * 3 + d.seed);
      const lg = ctx.createRadialGradient(30, -16, 0, 30, -16, 22);
      lg.addColorStop(0, `rgba(180,255,230,${glow})`); lg.addColorStop(1, 'rgba(180,255,230,0)');
      ctx.fillStyle = lg; ctx.fillRect(8, -38, 44, 44);
      ctx.fillStyle = '#e8fff6'; ctx.beginPath(); ctx.arc(14, -3, 2.5, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'glow': {
      for (let i = 0; i < 7; i++) {
        const a = 0.3 + 0.5 * Math.abs(Math.sin(t * 1.5 + d.seed + i));
        ctx.fillStyle = `hsla(${170 + i * 12},100%,75%,${a})`;
        ctx.beginPath(); ctx.arc(Math.sin(d.seed + i * 1.7) * 30, Math.cos(d.seed + i * 2.3) * 20, 2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'fish': {
      for (let i = 0; i < 5; i++) {
        const fx = (i % 3) * 18 - 18, fy = Math.floor(i / 3) * 14 - 7 + Math.sin(t * 3 + i) * 2;
        ctx.fillStyle = `hsla(${d.hue},70%,60%,0.75)`;
        ctx.beginPath(); ctx.ellipse(fx, fy, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(fx - 7, fy); ctx.lineTo(fx - 13, fy - 4); ctx.lineTo(fx - 13, fy + 4); ctx.closePath(); ctx.fill();
      }
      break;
    }
    case 'jelly': {
      const pulse = Math.sin(t * 2 + d.seed) * 2;
      ctx.fillStyle = 'rgba(230,160,255,0.45)';
      ctx.beginPath(); ctx.ellipse(0, 0, 14 + pulse, 10 - pulse * 0.5, 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(230,170,255,0.5)'; ctx.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 5, 0); ctx.quadraticCurveTo(i * 5 + Math.sin(t * 3 + i) * 4, 12, i * 5, 24); ctx.stroke(); }
      break;
    }
    case 'cloud': {
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (const [cx, cy, r] of [[-22, 4, 14], [0, -4, 19], [22, 4, 14], [8, 8, 12], [-10, 8, 12]]) { ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
      break;
    }
    case 'bird': {
      ctx.strokeStyle = 'rgba(30,40,60,0.7)'; ctx.lineWidth = 2;
      const f = Math.sin(t * 8 + d.seed) * 5;
      ctx.beginPath(); ctx.moveTo(-10, -f); ctx.quadraticCurveTo(-5, -3, 0, 0); ctx.quadraticCurveTo(5, -3, 10, -f); ctx.stroke();
      break;
    }
    case 'plane': {
      ctx.fillStyle = 'rgba(240,240,250,0.85)';
      ctx.beginPath(); ctx.ellipse(0, 0, 22, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(-10, 12); ctx.lineTo(-4, 12); ctx.lineTo(6, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-24, -8); ctx.lineTo(-20, -8); ctx.lineTo(-14, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-90, 0); ctx.stroke();
      break;
    }
    case 'planet': {
      const pg = ctx.createRadialGradient(-8, -8, 2, 0, 0, 28);
      pg.addColorStop(0, `hsl(${d.hue},60%,70%)`); pg.addColorStop(1, `hsl(${d.hue},50%,30%)`);
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
      if (d.seed > 3) { ctx.strokeStyle = `hsla(${d.hue + 40},70%,80%,0.7)`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, 0, 42, 9, -0.3, 0, Math.PI * 2); ctx.stroke(); }
      break;
    }
    case 'satellite': {
      ctx.rotate(Math.sin(t * 0.5 + d.seed) * 0.3);
      ctx.fillStyle = '#c9ccd6'; ctx.fillRect(-6, -6, 12, 12);
      ctx.fillStyle = '#3a6fd8'; ctx.fillRect(-28, -4, 18, 8); ctx.fillRect(10, -4, 18, 8);
      ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(0, -9, 2, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'comet': {
      const cg = ctx.createLinearGradient(-60, 0, 0, 0);
      cg.addColorStop(0, 'rgba(150,220,255,0)'); cg.addColorStop(1, 'rgba(200,240,255,0.8)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(-60, -2); ctx.lineTo(0, -5); ctx.lineTo(0, 5); ctx.lineTo(-60, 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawSquid(s, col) {
  const x = s.x - 0, y = s.y - camY;
  const sq = s.squash;
  ctx.save();
  if (col) ctx.globalAlpha = col.alpha;
  ctx.translate(x + s.w / 2, y + s.h);
  ctx.scale(1 + sq * 0.18, 1 - sq * 0.18);
  ctx.translate(0, -s.h);
  const orange = col ? col.main : '#ff5a1f', dark = col ? col.dark : '#c9400f';
  // fins
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(0, 2); ctx.lineTo(-20, 14); ctx.lineTo(-6, 20); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, 2); ctx.lineTo(20, 14); ctx.lineTo(6, 20); ctx.closePath(); ctx.fill();
  // mantle
  ctx.fillStyle = orange;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(14, 2, 15, 22, 13, 30);
  ctx.lineTo(-13, 30);
  ctx.bezierCurveTo(-15, 22, -14, 2, 0, 0);
  ctx.fill();
  // tentacles (wiggle based on vy)
  const wig = Math.sin(Date.now() / 90) * 2 + (s.vy < 0 ? 3 : -2);
  ctx.strokeStyle = orange; ctx.lineCap = 'round'; ctx.lineWidth = 4.5;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 5, 28);
    ctx.quadraticCurveTo(i * 7 + wig * (i % 2 ? 1 : -1), 38, i * 8, 44 + Math.abs(i) * -1.5);
    ctx.stroke();
  }
  // eyes
  const ex = s.face * 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5 + ex, 20, 4, 0, Math.PI * 2); ctx.arc(5 + ex, 20, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-4.5 + ex * 1.5, 20.5, 2, 0, Math.PI * 2); ctx.arc(5.5 + ex * 1.5, 20.5, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawPlat(p) {
  const y = p.y - camY;
  if (p.type === 'rock') { drawSeabed(p); return; }
  const cx = p.x + p.w / 2, cy = y + 6;
  const t = Date.now() / 300 + p.seed;
  // wobble harder as the pop gets closer
  const danger = p.timer > 0 ? 1 - p.timer / p.popTime : 0;
  const wob = 1.5 + danger * 5;
  const rx = p.w / 2 + Math.sin(t * (1 + danger * 4)) * wob;
  const ry = 11 + Math.cos(t * (1 + danger * 4)) * wob * 0.6;
  const fragile = p.type === 'fragile';
  const g = ctx.createRadialGradient(cx - rx * 0.3, cy - ry * 0.4, 1, cx, cy, rx);
  g.addColorStop(0, fragile ? 'rgba(255,200,230,0.35)' : 'rgba(200,240,255,0.30)');
  g.addColorStop(0.75, fragile ? 'rgba(255,150,200,0.18)' : 'rgba(120,210,255,0.16)');
  g.addColorStop(1, fragile ? 'rgba(255,170,210,0.55)' : 'rgba(170,230,255,0.6)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = fragile ? 1.2 : 2;
  const inAir = altAt(p.y) >= SURFACE;
  const rim = fragile ? 'rgba(255,190,225,0.9)' : (inAir ? `hsla(${(t * 40 + p.seed * 60) % 360},85%,80%,0.95)` : 'rgba(220,245,255,0.9)');
  ctx.strokeStyle = danger > 0.6 && Math.floor(Date.now() / 80) % 2 ? 'rgba(255,120,90,0.9)' : rim;
  ctx.stroke();
  // highlights
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.ellipse(cx - rx * 0.45, cy - ry * 0.4, rx * 0.16, ry * 0.22, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + rx * 0.5, cy + ry * 0.35, 1.6, 0, Math.PI * 2); ctx.fill();
  if (p.spring) {
    // little yellow starfish: bounces you high
    ctx.fillStyle = '#ffd34d';
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 4 : 9;
      ctx.lineTo(cx + Math.cos(a) * r, y - 5 + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  }
}

function draw() {
  drawBackground();

  if (state !== 'start') {
    for (const p of plats) drawPlat(p);
    for (const pt of particles) { ctx.globalAlpha = pt.life; ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 2, pt.y - camY - 2, 4, 4); }
    ctx.globalAlpha = 1;
    drawGhosts();
    drawSquid(squid);
    drawScoreboard();

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,.25)'; roundRect(12, 12, 150, 54, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 24px system-ui, sans-serif'; ctx.textBaseline = 'top';
    ctx.fillText(maxClimb, 24, 18);
    ctx.font = '600 13px system-ui, sans-serif'; ctx.globalAlpha = .8;
    ctx.fillText(`Livello ${level}`, 24, 46); ctx.globalAlpha = 1;
    // progress bar to next level
    const prog = (maxClimb - (level - 1) * LEVEL_HEIGHT / 10) / (LEVEL_HEIGHT / 10);
    ctx.fillStyle = 'rgba(255,255,255,.2)'; roundRect(96, 48, 56, 8, 4); ctx.fill();
    ctx.fillStyle = '#ff6a2b'; roundRect(96, 48, Math.max(8, 56 * Math.min(1, prog)), 8, 4); ctx.fill();
  }
}

function loop() {
  if (state === 'play') { update(); sendPresence(false); }
  draw();
  requestAnimationFrame(loop);
}

// ---------- multiplayer ----------
// Everyone who opens the same link (same #code) joins the same room. Each player climbs the
// same seeded map; the others appear as coloured "ghost" squids with their name, and a live
// leaderboard shows who is highest. Nothing is stored: it only works while people have it open.
const COLORS = [
  { main: '#3d8bff', dark: '#1f5fc4' }, { main: '#3ddc97', dark: '#1f9a66' }, { main: '#b46bff', dark: '#7b3cc4' },
  { main: '#ff5fa8', dark: '#c4337a' }, { main: '#ffd23d', dark: '#c49a10' }, { main: '#35d6e8', dark: '#1a98a8' },
  { main: '#ff4d4d', dark: '#b82525' }, { main: '#e8e8f0', dark: '#a0a0b8' },
];
function cleanCode(v) { return (v || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24); }
function cleanNick(v) { return String(v || '').replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2066-\u2069]/g, '').trim().slice(0, 14); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

let roomCode = cleanCode(location.hash.slice(1));
if (!roomCode) {
  roomCode = Math.random().toString(36).slice(2, 7);
  try { location.hash = roomCode; } catch (e) {}
}
const inviteUrl = () => location.origin + location.pathname + '#' + roomCode;

let myNick = cleanNick(lsGet('squidjump_nick')) || ('Calamaro' + Math.floor(Math.random() * 90 + 10));
let myColor = parseInt(lsGet('squidjump_color') || '', 10);
if (!(myColor >= 0 && myColor < COLORS.length)) { myColor = Math.floor(Math.random() * COLORS.length); lsSet('squidjump_color', String(myColor)); }
const nickInput = document.getElementById('nick');
nickInput.value = myNick;
nickInput.addEventListener('input', () => {
  const v = cleanNick(nickInput.value);
  if (v) { myNick = v; lsSet('squidjump_nick', v); sendPresence(true); }
});

let room = null, mpState = 'connecting', peersNow = [], myRound = 0;
const ghosts = new Map(); // peer → smoothed position

function others() {
  return peersNow.filter(p => !p.sameTab && p.presence && typeof p.presence.n === 'string');
}
function pNick(p) { return cleanNick(p.presence.n) || 'Calamaro'; }
function pColor(p) { const c = p.presence.c | 0; return COLORS[(c % COLORS.length + COLORS.length) % COLORS.length]; }

let lastPresence = 0;
function sendPresence(force) {
  if (!room) return;
  const now = performance.now();
  if (!force && now - lastPresence < 80) return; // ~12 updates a second
  lastPresence = now;
  const st = state === 'play' ? 'play' : (state === 'over' ? 'dead' : 'lobby');
  const data = { n: myNick, c: myColor, r: myRound, s: st, sc: maxClimb || 0, lv: level || 1 };
  if (squid && st !== 'lobby') {
    data.a = Math.round(altAt(squid.y) * 10) / 10;
    data.x = Math.round((squid.x / W) * 1000) / 1000;
    data.f = squid.face;
  }
  room.presence(data).catch(() => {});
}

function playingRound() {
  const rs = others().filter(p => p.presence.s === 'play').map(p => p.presence.r | 0);
  return rs.length ? Math.max(...rs) : 0;
}
function chooseRound() {
  if (!room) return myRound + 1;
  const pr = playingRound();
  if (pr) return pr; // join the race that's already running: same map
  return Math.max(myRound, ...others().map(p => p.presence.r | 0)) + 1;
}

function li(color, name, score, extra) {
  const el = document.createElement('li');
  const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = color;
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = name;
  const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = score;
  el.append(dot, nm);
  if (extra) { const ex = document.createElement('span'); ex.textContent = extra; el.append(ex); }
  el.append(sc);
  return el;
}

function renderLobby() {
  const st = document.getElementById('mpStatus');
  const os = others();
  if (mpState === 'off') st.textContent = 'Multigiocatore non disponibile (sei offline?): puoi giocare da solo.';
  else if (mpState === 'connecting') st.textContent = 'Collegamento alla stanza…';
  else st.textContent = `🟢 Stanza ${roomCode} · ${os.length + 1} ${os.length ? 'giocatori' : 'giocatore (solo tu)'}`;

  // start screen: who is here
  const list = document.getElementById('lobbyList');
  list.replaceChildren();
  if (mpState === 'on') {
    list.append(li('#ff5a1f', myNick + ' (tu)', ''));
    for (const p of os) {
      const ps = p.presence.s;
      list.append(li(pColor(p).main, pNick(p), ps === 'play' ? `${p.presence.sc | 0}` : '', ps === 'play' ? '🦑 in gioco' : (ps === 'dead' ? '💥' : '⏳')));
    }
  }
  const pr = mpState === 'on' ? playingRound() : 0;
  const players = os.filter(p => p.presence.s === 'play' && (p.presence.r | 0) === pr).map(pNick);
  const hint = pr ? `${players.join(', ')} ${players.length > 1 ? 'stanno' : 'sta'} giocando: entra nella stessa partita!` : (os.length ? 'Premi Gioca e gli altri potranno unirsi alla tua partita.' : '');
  document.getElementById('joinHint').textContent = hint;
  document.getElementById('playBtn').textContent = pr ? 'Unisciti' : 'Gioca';

  // game over screen: ranking of my round
  const ol = document.getElementById('overList');
  ol.replaceChildren();
  if (mpState === 'on' && state === 'over') {
    const rows = [{ name: myNick + ' (tu)', color: '#ff5a1f', sc: maxClimb, s: 'dead' }]
      .concat(os.filter(p => (p.presence.r | 0) === myRound && p.presence.s !== 'lobby').map(p => ({ name: pNick(p), color: pColor(p).main, sc: p.presence.sc | 0, s: p.presence.s })));
    rows.sort((a, b) => b.sc - a.sc);
    rows.forEach((r, i) => ol.append(li(r.color, `${i + 1}. ${r.name}`, r.sc, r.s === 'play' ? '🦑' : '')));
    const stillPlaying = os.some(p => (p.presence.r | 0) === myRound && p.presence.s === 'play');
    document.getElementById('overHint').textContent = stillPlaying ? 'Gli altri stanno ancora salendo…' : '';
    document.getElementById('retryBtn').textContent = playingRound() ? 'Rientra nella partita' : 'Nuova partita';
  } else {
    document.getElementById('overHint').textContent = '';
    document.getElementById('retryBtn').textContent = 'Riprova';
  }
}
setInterval(() => { if (state !== 'play') renderLobby(); }, 1000);

// ---------- networking (PeerJS, no accounts needed) ----------
// The first player to open a room link claims the peer id "squidjump-v1-<code>" and becomes the hub;
// everyone else connects to it. Each player sends their own state to the hub, the hub sends everyone's
// state to all ~10 times a second. If the hub leaves, the remaining players race to claim the id and the
// loser simply reconnects to the winner. Exposes the same small interface the game already uses:
// presence(patch), onPeers(fn), with peers shaped as { peer, sameTab, presence }.
function makeNetRoom(code) {
  const HUB_ID = 'squidjump-v1-' + code;
  let peer = null, myId = null, isHub = false, hubConn = null, destroyed = false;
  let mine = {};
  let table = {};                 // peerId → { p: presence, t: last seen (ms) }
  const conns = new Map();        // hub only: peerId → DataConnection
  const peerFns = [], connFns = [];
  let lastIds = new Set();

  const now = () => Date.now();
  function snapshot() {
    const list = [{ peer: myId || 'me', isMe: true, sameTab: true, presence: mine }];
    for (const [id, v] of Object.entries(table)) if (id !== myId) list.push({ peer: id, isMe: false, sameTab: false, presence: v.p });
    return list;
  }
  function firePeers() {
    const list = snapshot();
    const ids = new Set(list.map(p => p.peer));
    const left = [...lastIds].filter(id => !ids.has(id)).map(id => ({ peer: id }));
    lastIds = ids;
    peerFns.forEach(f => { try { f({ peers: list, left }); } catch (e) {} });
  }
  function setConnected(v) { connFns.forEach(f => { try { f(v); } catch (e) {} }); }

  function cleanup() {
    try { if (peer) peer.destroy(); } catch (e) {}
    peer = null; hubConn = null; isHub = false; conns.clear();
  }
  function retrySoon() {
    if (destroyed) return;
    cleanup(); table = {}; firePeers(); setConnected(false);
    setTimeout(becomeHub, 300 + Math.random() * 1200);
  }

  function becomeHub() {
    if (destroyed) return;
    cleanup();
    peer = new Peer(HUB_ID);
    peer.on('open', id => { myId = id; isHub = true; setConnected(true); firePeers(); });
    peer.on('connection', c => {
      c.on('open', () => conns.set(c.peer, c));
      c.on('data', d => {
        if (d && d.t === 'p' && d.p && typeof d.p === 'object') { table[c.peer] = { p: d.p, t: now() }; firePeers(); }
      });
      const gone = () => { conns.delete(c.peer); if (table[c.peer]) { delete table[c.peer]; firePeers(); } };
      c.on('close', gone); c.on('error', gone);
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', e => {
      if (e && e.type === 'unavailable-id') becomeClient();   // someone already hosts this room: join them
      else if (e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed')) retrySoon();
    });
  }

  function becomeClient() {
    if (destroyed) return;
    cleanup();
    peer = new Peer();
    peer.on('open', id => {
      myId = id;
      hubConn = peer.connect(HUB_ID, { reliable: true });
      hubConn.on('open', () => { setConnected(true); hubConn.send({ t: 'p', p: mine }); });
      hubConn.on('data', d => {
        if (!d || d.t !== 'all' || typeof d.all !== 'object') return;
        const nt = {};
        for (const [id, p] of Object.entries(d.all)) if (id !== myId && p && typeof p === 'object') nt[id] = { p, t: now() };
        table = nt; firePeers();
      });
      hubConn.on('close', retrySoon);   // hub left: try to take over the room
      hubConn.on('error', retrySoon);
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
    peer.on('error', e => {
      if (e && e.type === 'peer-unavailable') becomeHub();   // nobody hosts it (any more): take it
      else if (e && e.type === 'unavailable-id') retrySoon();
      else if (e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error' || e.type === 'socket-closed')) retrySoon();
    });
  }

  // hub: share everyone's state; drop players silent for 6 s. client: heartbeat.
  setInterval(() => {
    if (destroyed || !peer) return;
    if (isHub) {
      let changed = false;
      for (const [id, v] of Object.entries(table)) if (now() - v.t > 6000) { delete table[id]; changed = true; }
      if (changed) firePeers();
      const all = { [myId]: mine };
      for (const [id, v] of Object.entries(table)) all[id] = v.p;
      for (const c of conns.values()) { try { if (c.open) c.send({ t: 'all', all }); } catch (e) {} }
    } else if (hubConn && hubConn.open) {
      try { hubConn.send({ t: 'p', p: mine }); } catch (e) {}
    }
  }, 100);
  window.addEventListener('pagehide', () => { destroyed = true; cleanup(); });

  becomeHub();
  return {
    presence(patch) {
      mine = Object.assign({}, mine, patch);
      if (!isHub && hubConn && hubConn.open) { try { hubConn.send({ t: 'p', p: mine }); } catch (e) {} }
      return Promise.resolve();
    },
    onPeers(fn) { peerFns.push(fn); setTimeout(() => fn({ peers: snapshot(), left: [] }), 0); return () => {}; },
    onConnection(fn) { connFns.push(fn); return () => {}; },
  };
}

function initRoom() {
  if (typeof Peer === 'undefined') { mpState = 'off'; renderLobby(); return; }
  try { room = makeNetRoom(roomCode); } catch (e) { room = null; mpState = 'off'; renderLobby(); return; }
  mpState = 'connecting';
  room.onConnection(c => { mpState = c ? 'on' : 'connecting'; renderLobby(); });
  room.onPeers(ch => {
    peersNow = ch.peers;
    for (const p of ch.left) ghosts.delete(p.peer);
    if (state !== 'play') renderLobby();
  });
  sendPresence(true);
  renderLobby();
}
initRoom();

// copy invite link (from the click itself, as browsers require)
document.querySelectorAll('.copyBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const url = inviteUrl();
    const box = btn.nextElementSibling;
    const done = ok => {
      btn.textContent = ok ? '✅ Link copiato!' : 'Copia il link qui sotto:';
      if (!ok) { box.value = url; box.classList.remove('hiddenEl'); box.focus(); box.select(); }
      setTimeout(() => { btn.textContent = '📋 Copia link per invitare'; }, 2500);
    };
    try {
      const pr = navigator.clipboard && navigator.clipboard.writeText(url);
      if (pr && pr.then) pr.then(() => done(true), () => done(false)); else done(false);
    } catch (e) { done(false); }
  });
});

function ghostList() {
  return others().filter(p => p.presence.s !== 'lobby' && (p.presence.r | 0) === myRound && typeof p.presence.a === 'number');
}

function drawGhosts() {
  if (!room) return;
  const topLimit = 80, botLimit = H - 130;
  for (const p of ghostList()) {
    const pr = p.presence;
    const tx = (+pr.x || 0) * W, ty = worldYAt(+pr.a || 0);
    let g = ghosts.get(p.peer);
    if (!g) { g = { x: tx, y: ty }; ghosts.set(p.peer, g); }
    // smooth movement between updates (snap across the screen wrap)
    if (Math.abs(tx - g.x) > W / 2) g.x = tx; else g.x += (tx - g.x) * 0.35;
    g.y += (ty - g.y) * 0.35;
    const col = pColor(p), dead = pr.s === 'dead';
    const sy = g.y - camY;
    const name = pNick(p);
    if (sy < topLimit - 44 || sy > botLimit) {
      // off screen: show a marker on the edge with name and distance
      const up = sy < topLimit - 44;
      const my = up ? topLimit : botLimit;
      const mx = Math.max(30, Math.min(W - 30, g.x + 18));
      ctx.globalAlpha = dead ? 0.5 : 0.9;
      ctx.fillStyle = col.main;
      ctx.beginPath();
      if (up) { ctx.moveTo(mx, my - 10); ctx.lineTo(mx - 8, my); ctx.lineTo(mx + 8, my); }
      else { ctx.moveTo(mx, my + 10); ctx.lineTo(mx - 8, my); ctx.lineTo(mx + 8, my); }
      ctx.closePath(); ctx.fill();
      ctx.font = '700 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = up ? 'top' : 'bottom';
      const dist = Math.abs(Math.round((+pr.a || 0) - altAt(squid.y)));
      ctx.fillText(`${name}${dead ? ' 💥' : ''} ${up ? '↑' : '↓'}${dist}`, mx, up ? my + 4 : my - 4);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
      continue;
    }
    drawSquid({ x: g.x, y: g.y, w: 36, h: 44, face: pr.f === -1 ? -1 : 1, vy: 0, squash: 0 }, { main: col.main, dark: col.dark, alpha: dead ? 0.3 : 0.6 });
    ctx.globalAlpha = dead ? 0.5 : 0.95;
    ctx.font = '700 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    const tw = ctx.measureText(name).width + 10;
    roundRect(g.x + 18 - tw / 2, sy - 20, tw, 17, 8); ctx.fill();
    ctx.fillStyle = col.main; ctx.fillText(name + (dead ? ' 💥' : ''), g.x + 18, sy - 5);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

function drawScoreboard() {
  if (!room) return;
  const gl = ghostList();
  if (!gl.length) return;
  const rows = [{ name: myNick, color: '#ff5a1f', sc: maxClimb, me: true, dead: false }]
    .concat(gl.map(p => ({ name: pNick(p), color: pColor(p).main, sc: p.presence.sc | 0, dead: p.presence.s === 'dead' })));
  rows.sort((a, b) => b.sc - a.sc);
  const shown = rows.slice(0, 5), w = 132, x = W - w - 12;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; roundRect(x, 12, w, 10 + shown.length * 18, 10); ctx.fill();
  ctx.font = '600 12px system-ui, sans-serif'; ctx.textBaseline = 'top';
  shown.forEach((r, i) => {
    const y = 18 + i * 18;
    ctx.globalAlpha = r.dead ? 0.5 : 1;
    ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(x + 12, y + 7, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    let nm = (i + 1) + '. ' + r.name; if (nm.length > 12) nm = nm.slice(0, 11) + '…';
    ctx.font = (r.me ? '800 ' : '600 ') + '12px system-ui, sans-serif';
    ctx.fillText(nm, x + 21, y);
    ctx.textAlign = 'right'; ctx.fillText(r.sc, x + w - 8, y); ctx.textAlign = 'left';
  });
  ctx.globalAlpha = 1;
}

// ---------- round flow ----------
function start() {
  myRound = chooseRound();
  // pick a colour nobody else in the room is using
  const used = new Set(others().map(p => p.presence.c | 0));
  if (used.has(myColor)) {
    const free = COLORS.map((_, i) => i).filter(i => !used.has(i));
    if (free.length) { myColor = free[Math.floor(Math.random() * free.length)]; lsSet('squidjump_color', String(myColor)); }
  }
  // multiplayer: the room code + round number pick the map, so everyone in the round gets the same one
  reset(room ? `${roomCode}:${myRound}` : null);
  state = 'play';
  ghosts.clear();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('controls').classList.remove('hidden');
  leftHeld = rightHeld = false; touchDir = 0; keyDir = 0;
  document.getElementById('over').classList.add('hidden');
  sendPresence(true);
}

function gameOver() {
  state = 'over';
  document.getElementById('controls').classList.add('hidden');
  if (maxClimb > best) { best = maxClimb; saveBest(); }
  document.getElementById('finalScore').textContent = `Punteggio: ${maxClimb} · Livello ${level} · ${ZONES[zoneIndex(maxClimb)].name.replace('!', '')}`;
  document.getElementById('finalBest').textContent = `Record: ${best}`;
  document.getElementById('over').classList.remove('hidden');
  sendPresence(true);
  renderLobby();
  if (navigator.vibrate) try { navigator.vibrate([80, 40, 80]); } catch (e) {}
}

document.getElementById('playBtn').addEventListener('click', start);
document.getElementById('retryBtn').addEventListener('click', start);
reset();
renderLobby();
loop();
</script>
